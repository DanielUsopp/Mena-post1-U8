<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Confirmar Eliminación</title></head>
<body>
<h1>¿Está seguro de eliminar esta categoría?</h1>
<div>
    <p><strong>Nombre:</strong> <span th:text="${categoria.nombre}"></span></p>
    <p><strong>Descripción:</strong> <span th:text="${categoria.descripcion}"></span></p>
</div>
<form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}" method="post">
    <button type="submit">Sí, eliminar</button>
    <a th:href="@{/categorias}">Cancelar</a>
</form>
</body>
</html>
